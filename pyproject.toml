[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plcfsm"
version = "0.1.0"
description = "Maquinas de estados em Python no estilo CLP: ciclo de varredura, CASE, R_TRIG, timers, tabela de decisao."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/tuliosalustiano27/MaquinaEstados_Python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
